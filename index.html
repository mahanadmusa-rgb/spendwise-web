<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
     <h1>SpendWise</h1> 
     <p>Track your income and expenses in one place</p> 
    </header>    
<main>
    <section class="summary"> 
        <div class="card"> 
            <h3>Budget</h3> 
            <p id="budget">KSh 0</p>
            </div>

            <div class="card"> 
                <h3>Total Expenses</h3> 
                <p id="totalExpenses">KSh 0</p> 
            </div>
            <div class="card"> 
                <h3>Balance</h3> 
                <p id="balance">KSh 0</p> 
            </div>

            </section> 
            <section class="form-section"> 
                <h2>Add Expense</h2>
                <form id="expenseForm"> 
                    <label for="expenseName">Expense Name</label> 
                    <input type="text" id="expenseName" placeholder="e.g. Transport" required>
                    <label for="expenseAmount">Amount (KSh)</label> 
                    <input type="number" id="expenseAmount" placeholder="e.g. 200" required> 
                    
                    <button type="submit">Add Expense</button>
                    </form>

                    <p id="message"></p> 
                </section> <section class="expenses-section"> 
                    <h2>Expense Records</h2> <ul id="expenseList"></ul> 
                
                </section> 
                <section class="feedback"> 
                    <h2>Budget Status</h2> 
                    <p id="budgetMessage">Add an expense to see your budget status.</p> 
                </section>

</main>
<script src="script.js"></script>


</body>
</html>
